# Сборка мода собирает сначала соседей линейки: инструмент разделения сторон и ядро живут в отдельных
# репозиториях и в локальном maven, публичного зеркала у них нет. Репозитории открытые, поэтому ключ
# для этого не нужен.
name: Сборка

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Сборка на JDK 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mod
      - uses: actions/checkout@v4
        with:
          repository: CodeAndCubes/CodeSides
          path: CodeSides
      - uses: actions/checkout@v4
        with:
          repository: CodeAndCubes/CodeCore
          path: CodeCore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x mod/gradlew CodeSides/gradlew CodeCore/gradlew
      - name: Инструмент разделения сторон в локальный maven
        run: ./gradlew publishToMavenLocal -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
        working-directory: CodeSides
      - name: Ядро линейки в локальный maven
        run: ./gradlew publishToMavenLocal -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
        working-directory: CodeCore
      - name: Форматирование и сборка
        run: ./gradlew spotlessCheck build --stacktrace
        working-directory: mod
      - name: Байткод обязан быть восьмым
        run: python3 mod/.github/check-bytecode.py mod/build/libs
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            mod/build/libs/*.jar
            !mod/build/libs/*-sources.jar

  tests:
    name: Тесты на JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 8, 21, 25 ]
    steps:
      - uses: actions/checkout@v4
        with:
          path: mod
      - uses: actions/checkout@v4
        with:
          repository: CodeAndCubes/CodeSides
          path: CodeSides
      - uses: actions/checkout@v4
        with:
          repository: CodeAndCubes/CodeCore
          path: CodeCore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x mod/gradlew CodeSides/gradlew CodeCore/gradlew
      - name: Инструмент разделения сторон в локальный maven
        run: ./gradlew publishToMavenLocal -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
        working-directory: CodeSides
      - name: Ядро линейки в локальный maven
        run: ./gradlew publishToMavenLocal -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
        working-directory: CodeCore
      - name: Тесты
        run: >-
          ./gradlew test -PtestJdk=${{ matrix.java }}
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java }}_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
          --stacktrace
        working-directory: mod
